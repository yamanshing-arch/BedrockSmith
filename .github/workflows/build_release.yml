name: Build & Publish BedrockSmith Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Platform
        run: |
          flutter create --platforms=android --project-name bedrock_smith .
          flutter pub get
          if [ -f assets/icon.png ]; then dart run flutter_launcher_icons; fi

      - name: Configure Android Manifest Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Standalone APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockSmith-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-2022
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Scaffold
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name bedrock_smith .
          flutter pub get

      - name: Build Standalone Windows Bundle
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: flutter build windows --release

      - name: Package Windows Bundle into ZIP
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\BedrockSmith-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockSmith-Windows-x64
          path: build/BedrockSmith-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: BedrockSmith-Android
          path: ./release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: BedrockSmith-Windows-x64
          path: ./release-artifacts

      - name: Create Multi-Platform Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            ./release-artifacts/app-release.apk
            ./release-artifacts/BedrockSmith-Windows-x64.zip
          name: BedrockSmith Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true